name: Terraform Validation

on:
  push:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform*.yml"
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform*.yml"

jobs:
  validate:
    name: Validate OCI staging config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/environments/oci-staging
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt
        working-directory: infra/terraform
        run: terraform fmt -check -recursive environments/oci-staging modules/oci-network modules/oci-storage modules/oci-database modules/oci-loadbalancer modules/oci-security modules/oci-compute modules/oci-monitoring

      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate
