#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose
  - jq
  - curl
  - nginx

write_files:
  - path: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }
    owner: root:root
    permissions: '0644'

  - path: /opt/firstweeks/docker-compose.yml
    content: |
      version: '3.8'
      services:
        web:
          image: ${web_image}
          environment:
            VITE_API_URL: ${api_url}
            NODE_ENV: ${node_env}
          ports:
            - "${port}:${port}"
          restart: always
          healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:${port}/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
          logging:
            driver: "json-file"
            options:
              max-size: "10m"
              max-file: "3"

        nginx:
          image: nginx:alpine
          ports:
            - "80:80"
            - "443:443"
          volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - ./ssl:/etc/nginx/ssl:ro
          restart: always
          depends_on:
            - web

  - path: /opt/firstweeks/nginx.conf
    content: |
      events {
        worker_connections 1024;
      }
      http {
        upstream web_backend {
          server web:${port};
        }
        server {
          listen 80;
          server_name _;
          location / {
            proxy_pass http://web_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
          }
          location /health {
            proxy_pass http://web_backend/health;
            access_log off;
          }
        }
      }

runcmd:
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker opc
  - mkdir -p /opt/firstweeks/ssl
  - cd /opt/firstweeks && docker compose pull
  - cd /opt/firstweeks && docker compose up -d
  - echo "Firstweeks Web instance started" > /var/log/firstweeks-web-startup.log

final_message: "Firstweeks Web instance configured and started after $UPTIME seconds"